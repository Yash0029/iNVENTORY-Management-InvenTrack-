services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: retail_inventory
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend/inventory-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/retail_inventory?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-secret-before-deployment}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend/inventory-frontend
    ports:
      - "4200:4000"
    depends_on:
      - backend

volumes:
  mysql_data:
