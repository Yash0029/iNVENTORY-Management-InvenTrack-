<div class="login-page">

    <div class="login-background">
  
      <div class="glow glow-one"></div>
      <div class="glow glow-two"></div>
  
    </div>
  
  
    <div class="login-card">
  
      <div class="login-brand">
  
        <div class="brand-logo">
          I
        </div>
  
        <div>
          <h1>InvenTrack</h1>
          <p>Retail Inventory Management</p>
        </div>
  
      </div>
  
  
      <div class="login-heading">
  
        <h2>Welcome back</h2>
  
        <p>
          Sign in to access your inventory dashboard.
        </p>
  
      </div>
  
  
      <form (ngSubmit)="login()">
  
        <div class="form-group">
  
          <label for="email">
            Email
          </label>
  
          <input
            id="email"
            type="email"
            name="email"
            [(ngModel)]="email"
            placeholder="you@example.com"
            autocomplete="email"
          />
  
        </div>
  
  
        <div class="form-group">
  
          <label for="password">
            Password
          </label>
  
          <input
            id="password"
            type="password"
            name="password"
            [(ngModel)]="password"
            placeholder="Enter your password"
            autocomplete="current-password"
          />
  
        </div>
  
  
        <div
          *ngIf="error"
          class="error-message"
        >
          {{ error }}
        </div>
  
  
        <button
          type="submit"
          class="login-button"
          [disabled]="loading"
        >
  
          <span *ngIf="!loading">
            Sign In
          </span>
  
          <span *ngIf="loading">
            Signing in...
          </span>
  
        </button>
  
      </form>
  
      <p class="auth-switch">New to InvenTrack? <a routerLink="/register">Create an account</a></p>
  
    </div>
  
  </div>
